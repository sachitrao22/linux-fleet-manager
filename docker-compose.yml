# Production-style stack: control plane + PostgreSQL.
#   cp .env.example .env      # then set SECRET_KEY and AGENT_TOKEN
#   docker compose up --build
# Dashboard: http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleetmanager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleetmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fleet:fleet@db:5432/fleetmanager
      # Agentless: the container uses this key to SSH into hosts (mounted read-only below)
      SSH_KEY_PATH: /home/fleet/.ssh/id_ed25519
    volumes:
      - ~/.ssh:/home/fleet/.ssh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
